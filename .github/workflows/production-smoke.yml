name: Production smoke

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: HTTPS deployment URL to test
        required: true
        type: string
      asset_base_url:
        description: Optional HTTPS runtime asset root
        required: false
        type: string

concurrency:
  group: production-smoke-${{ github.event.deployment.id || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: HTTP release smoke
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      (github.event.deployment.environment == 'Production' ||
      github.event.deployment.environment == 'production'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out deployed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Select deployment URL
        env:
          DEPLOYMENT_URL: ${{ github.event.deployment_status.target_url }}
          MANUAL_URL: ${{ inputs.base_url }}
        run: |
          if [[ -n "$MANUAL_URL" ]]; then
            target="$MANUAL_URL"
          else
            target="$DEPLOYMENT_URL"
          fi
          if [[ -z "$target" ]]; then
            echo "No deployment URL was supplied." >&2
            exit 1
          fi
          echo "SMOKE_BASE_URL=$target" >> "$GITHUB_ENV"

      - name: Verify production routes, headers, and assets
        env:
          SMOKE_ASSET_BASE_URL: ${{ inputs.asset_base_url || vars.VITE_ASSET_BASE_URL }}
        run: npm run test:smoke
